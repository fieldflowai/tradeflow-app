<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title description">
  <title id="title">WorkCraft AI — Keep good work moving</title>
  <desc id="description">A LinkedIn personal-profile banner. The WorkCraft AI mark and message are set right of the profile-photo overlap area.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f1"/>
      <stop offset="1" stop-color="#ecefe7"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9884" stop-opacity=".04"/>
      <stop offset="1" stop-color="#536d5d" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <rect width="1584" height="396" fill="url(#bg)"/>
  <path d="M300 444c44-79 83-119 130-118 47 1 65 57 101 40 39-19 47-94 86-108" fill="none" stroke="#536d5d" stroke-opacity=".08" stroke-width="2"/>
  <path d="M1010 441c53-102 96-157 156-164 58-7 73 80 131 64 62-18 66-137 133-157 68-20 110 49 196-48" fill="none" stroke="url(#route)" stroke-width="3"/>
  <path d="M1122 428c60-73 103-109 143-107 50 3 62 61 101 45 43-17 58-80 96-89 39-9 72 20 122-17" fill="none" stroke="#536d5d" stroke-opacity=".09" stroke-width="2"/>
  <circle cx="1260" cy="274" r="7" fill="#e99466" fill-opacity=".65"/>
  <circle cx="1435" cy="181" r="5" fill="#536d5d" fill-opacity=".24"/>
  <text x="430" y="192" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800" letter-spacing="-2.5" fill="#1d2925">WorkCraft<tspan dx="8" fill="#dd7144">AI</tspan></text>
  <text x="435" y="245" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#536d5d">For the people who get the work done.</text>
  <text x="435" y="286" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1d2925">Keep good work moving.</text>
  <path d="M435 311h62" stroke="#e99466" stroke-width="4" stroke-linecap="round"/>
</svg>
